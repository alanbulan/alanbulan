<svg width="1000" height="390" viewBox="0 0 1000 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">technology badges</title><desc id="desc">Animated local technology badge wall.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1000" y2="390"><stop stop-color="#080A16"/><stop offset="1" stop-color="#101827"/></linearGradient><linearGradient id="g" x1="54" y1="58" x2="946" y2="330"><stop stop-color="#FF3FD4"/><stop offset=".48" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><filter id="glow" x="-20%" y="-25%" width="140%" height="150%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.badge{animation:float 5s ease-in-out infinite;transform-origin:center}.b2{animation-delay:-.35s}.b3{animation-delay:-.7s}.b4{animation-delay:-1.05s}.b5{animation-delay:-1.4s}.b6{animation-delay:-1.75s}.b7{animation-delay:-2.1s}.b8{animation-delay:-2.45s}.sweep{animation:sweep 5s linear infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes sweep{0%{transform:translateX(-180px);opacity:0}20%,70%{opacity:.35}100%{transform:translateX(1050px);opacity:0}}</style></defs>
  <rect width="1000" height="390" rx="30" fill="url(#bg)"/><rect x="2" y="2" width="996" height="386" rx="28" stroke="#FFFFFF" stroke-opacity=".1"/>
  <rect class="sweep" width="150" height="390" fill="url(#g)" opacity=".12"/>
  <text x="54" y="66" fill="#F8FAFC" font-family="Segoe UI,Arial" font-size="31" font-weight="900">Tech Badges</text><text x="54" y="98" fill="#A5B4FC" font-family="Segoe UI,Arial" font-size="15" font-weight="800" letter-spacing="2">SHIELDS STYLE · LOCAL SVG · RELIABLE LOADING</text>
  <g font-family="Segoe UI,Arial" font-weight="900" filter="url(#glow)">
    <g class="badge"><rect x="70" y="136" width="190" height="54" rx="18" fill="#111827" stroke="#46D1FD" stroke-opacity=".75"/><circle cx="100" cy="163" r="17" fill="#46D1FD"/><text x="100" y="170" text-anchor="middle" fill="#061827" font-size="18">F</text><text x="130" y="170" fill="#E0F2FE" font-size="20">Flutter</text></g>
    <g class="badge b2"><rect x="292" y="136" width="170" height="54" rx="18" fill="#111827" stroke="#0175C2" stroke-opacity=".75"/><circle cx="322" cy="163" r="17" fill="#0175C2"/><text x="322" y="170" text-anchor="middle" fill="#FFFFFF" font-size="17">D</text><text x="352" y="170" fill="#DBEAFE" font-size="20">Dart</text></g>
    <g class="badge b3"><rect x="494" y="136" width="178" height="54" rx="18" fill="#111827" stroke="#61DAFB" stroke-opacity=".75"/><circle cx="524" cy="163" r="17" fill="#61DAFB"/><text x="524" y="170" text-anchor="middle" fill="#061827" font-size="16">R</text><text x="554" y="170" fill="#CFFAFE" font-size="20">React</text></g>
    <g class="badge b4"><rect x="704" y="136" width="210" height="54" rx="18" fill="#111827" stroke="#3178C6" stroke-opacity=".75"/><circle cx="734" cy="163" r="17" fill="#3178C6"/><text x="734" y="169" text-anchor="middle" fill="#FFFFFF" font-size="13">TS</text><text x="764" y="170" fill="#DBEAFE" font-size="20">TypeScript</text></g>
    <g class="badge b5"><rect x="112" y="228" width="182" height="54" rx="18" fill="#111827" stroke="#5FA04E" stroke-opacity=".75"/><circle cx="142" cy="255" r="17" fill="#5FA04E"/><text x="142" y="261" text-anchor="middle" fill="#FFFFFF" font-size="13">JS</text><text x="172" y="262" fill="#DCFCE7" font-size="20">Node.js</text></g>
    <g class="badge b6"><rect x="326" y="228" width="178" height="54" rx="18" fill="#111827" stroke="#3776AB" stroke-opacity=".75"/><circle cx="356" cy="255" r="17" fill="#3776AB"/><text x="356" y="261" text-anchor="middle" fill="#FFFFFF" font-size="14">Py</text><text x="386" y="262" fill="#DBEAFE" font-size="20">Python</text></g>
    <g class="badge b7"><rect x="536" y="228" width="150" height="54" rx="18" fill="#111827" stroke="#F05032" stroke-opacity=".75"/><circle cx="566" cy="255" r="17" fill="#F05032"/><text x="566" y="261" text-anchor="middle" fill="#FFFFFF" font-size="14">G</text><text x="596" y="262" fill="#FFE4E6" font-size="20">Git</text></g>
    <g class="badge b8"><rect x="718" y="228" width="178" height="54" rx="18" fill="#111827" stroke="#FFFFFF" stroke-opacity=".45"/><circle cx="748" cy="255" r="17" fill="#F8FAFC"/><text x="748" y="261" text-anchor="middle" fill="#0F172A" font-size="13">GH</text><text x="778" y="262" fill="#F8FAFC" font-size="20">GitHub</text></g>
  </g>
  <path d="M86 332H914" stroke="url(#g)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" opacity=".85"/>
</svg>
