<svg width="1000" height="150" viewBox="0 0 1000 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">footer card</title><desc id="desc">Animated neon footer.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1000" y2="150"><stop stop-color="#080A16"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="g" x1="80" y1="75" x2="920" y2="75"><stop stop-color="#FF3FD4"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><filter id="glow" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.line{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 4s ease-in-out infinite}.txt{animation:pulse 3s ease-in-out infinite}@keyframes draw{0%{stroke-dashoffset:900;opacity:.2}55%,75%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-900;opacity:.2}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}</style></defs><rect width="1000" height="150" rx="30" fill="url(#bg)"/><rect x="2" y="2" width="996" height="146" rx="28" stroke="#FFFFFF" stroke-opacity=".1"/><path class="line" d="M92 48H908" stroke="url(#g)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/><text class="txt" x="500" y="100" fill="#F8FAFC" font-family="Segoe UI,Arial" font-size="20" font-weight="800" text-anchor="middle">Build useful things. Keep the interface sharp. Let the motion glow.</text></svg>
