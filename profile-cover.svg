<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">alanbulan anime GitHub profile cover</title>
  <desc id="desc">A neon anime-inspired developer profile banner for alanbulan.</desc>
  <defs>
