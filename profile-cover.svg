<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">alanbulan anime neon hero</title>
  <desc id="desc">Animated Japanese neon city anime profile cover for alanbulan.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050612"/>
      <stop offset="0.42" stop-color="#1B1033"/>
      <stop offset="1" stop-color="#061A2F"/>
    </linearGradient>
    <linearGradient id="neon" x1="80" y1="105" x2="820" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF3FD4"><animate attributeName="stop-color" values="#FF3FD4;#7C3AED;#06B6D4;#FFB86B;#FF3FD4" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="0.48" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#06B6D4;#FF3FD4;#7C3AED" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#06B6D4"><animate attributeName="stop-color" values="#06B6D4;#FFB86B;#FF3FD4;#06B6D4" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="moon" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(934 112) rotate(90) scale(172)">
      <stop offset="0" stop-color="#FFF8D7"/>
      <stop offset="0.5" stop-color="#FFA6E7"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="deep" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#000" flood-opacity="0.55"/></filter>
    <style>
