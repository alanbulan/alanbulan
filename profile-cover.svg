  <g opacity="0.82"><circle class="star" cx="116" cy="82" r="2.5" fill="#FFFFFF"/><circle class="star2" cx="210" cy="142" r="2" fill="#22D3EE"/><circle class="star" cx="334" cy="82" r="2.5" fill="#FF3FD4"/><circle class="star2" cx="524" cy="108" r="2" fill="#FFFFFF"/><circle class="star" cx="692" cy="72" r="2" fill="#22D3EE"/><circle class="star2" cx="1106" cy="90" r="2" fill="#FFFFFF"/></g>
