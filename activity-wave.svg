<svg width="1000" height="270" viewBox="0 0 1000 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">animated activity wave</title><desc id="desc">Animated contribution style neon wave.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1000" y2="270"><stop stop-color="#080A16"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="g" x1="40" y1="50" x2="960" y2="220"><stop stop-color="#FF3FD4"/><stop offset=".52" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.wave{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 5.6s ease-in-out infinite}.cell{animation:pulse 3s ease-in-out infinite}.c2{animation-delay:-.3s}.c3{animation-delay:-.6s}.c4{animation-delay:-.9s}.c5{animation-delay:-1.2s}@keyframes draw{0%{stroke-dashoffset:1100;opacity:.25}45%,70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-1100;opacity:.25}}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}</style></defs>
  <rect width="1000" height="270" rx="30" fill="url(#bg)"/><rect x="2" y="2" width="996" height="266" rx="28" stroke="#FFFFFF" stroke-opacity=".1"/>
  <text x="54" y="62" fill="#F8FAFC" font-family="Segoe UI,Arial" font-size="30" font-weight="900">Activity Flow</text><text x="54" y="91" fill="#A5B4FC" font-family="Segoe UI,Arial" font-size="15" font-weight="700" letter-spacing="2">CODE · BUILD · TEST · RELEASE</text>
