      <rect x="0" y="56" width="18" height="18" rx="5"/><rect x="26" y="56" width="18" height="18" rx="5"/><rect x="52" y="56" width="18" height="18" rx="5"/><rect x="78" y="56" width="18" height="18" rx="5"/><rect x="104" y="56" width="18" height="18" rx="5"/><rect x="130" y="56" width="18" height="18" rx="5"/><rect x="156" y="56" width="18" height="18" rx="5"/><rect x="182" y="56" width="18" height="18" rx="5"/>
    </g>
    <g fill="url(#g)" filter="url(#glow)"><rect class="cell" x="26" y="0" width="18" height="18" rx="5"/><rect class="cell c2" x="78" y="0" width="18" height="18" rx="5"/><rect class="cell c3" x="130" y="0" width="18" height="18" rx="5"/><rect class="cell c4" x="52" y="28" width="18" height="18" rx="5"/><rect class="cell c5" x="104" y="28" width="18" height="18" rx="5"/><rect class="cell c2" x="156" y="28" width="18" height="18" rx="5"/><rect class="cell c3" x="0" y="56" width="18" height="18" rx="5"/><rect class="cell c4" x="78" y="56" width="18" height="18" rx="5"/><rect class="cell c5" x="182" y="56" width="18" height="18" rx="5"/></g>
