<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc"><title id="title">Prism Delivery Console</title><desc id="desc">alanbulan 的开源作品集；装饰插画不表示实时状态或产品截图。</desc><defs><style>svg{--paper:#fbf8f4;--panel:#f1edf7;--ink:#2d3048;--muted:#686878;--line:#e5dfe8;--rose:#b7758d;--blue:#6d7eae;--chip:#f2ebee;--wash:#eee8f6} .paper{fill:var(--paper)}.panel{fill:var(--panel)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.line{stroke:var(--line)}.rose{fill:var(--rose)}.blue{fill:var(--blue)}.chip{fill:var(--chip)}.wash{fill:var(--wash)}text{font-family:Inter,'Segoe UI','Noto Sans CJK SC','Microsoft YaHei',sans-serif} .mono{font-family:'SFMono-Regular',Consolas,monospace}.serif{font-family:Georgia,'Noto Serif CJK SC',serif} @media(prefers-color-scheme:dark){svg{--paper:#181d2c;--panel:#242b3e;--ink:#eeedf5;--muted:#b0b2c6;--line:#373d51;--rose:#e2aac0;--blue:#aabbed;--chip:#303047;--wash:#272d44}}</style></defs><rect x="1" y="1" width="1198" height="248" rx="23" class="paper line" stroke-width="2"/><rect x="30" y="36" width="4" height="174" rx="2" fill="#6d968c"/><text x="59" y="61" class="mono muted" font-size="13" letter-spacing="2">03 / DEVELOPER TOOLS</text><text x="56" y="115" class="ink" font-size="40" font-weight="620" letter-spacing="-1">Prism Delivery Console</text><text x="59" y="158" class="muted" font-size="22">整理项目、读懂依赖，把交付流程收拢到一个工作台。</text><text x="59" y="207" class="mono muted" font-size="16">Tauri  ·  React  ·  Rust  ·  SQLite</text><g color="#6d968c"><circle cx="1068" cy="127" r="79" class="wash"/><path d="m1068 54 68 117h-136Z" class="paper" stroke="currentColor" stroke-width="2"/><path d="m1014 146 102-51m-48-41v117" stroke="currentColor" stroke-width="1.5" opacity=".4"/><path d="M954 127h80m61-1 74-22m-74 23 74 8m-74-7 69 39" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/></g><path d="M1154 31h14v14m0-14-16 16" class="line" stroke-width="2" fill="none"/></svg>
