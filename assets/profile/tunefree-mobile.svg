<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">TuneFree Desktop（移动版）</title><desc id="desc">alanbulan 的开源作品集；装饰插画不表示实时状态或产品截图。</desc><defs><style>svg{--paper:#fbf8f4;--panel:#f1edf7;--ink:#2d3048;--muted:#686878;--line:#e5dfe8;--rose:#b7758d;--blue:#6d7eae;--chip:#f2ebee;--wash:#eee8f6} .paper{fill:var(--paper)}.panel{fill:var(--panel)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.line{stroke:var(--line)}.rose{fill:var(--rose)}.blue{fill:var(--blue)}.chip{fill:var(--chip)}.wash{fill:var(--wash)}text{font-family:Inter,'Segoe UI','Noto Sans CJK SC','Microsoft YaHei',sans-serif} .mono{font-family:'SFMono-Regular',Consolas,monospace}.serif{font-family:Georgia,'Noto Serif CJK SC',serif} @media(prefers-color-scheme:dark){svg{--paper:#181d2c;--panel:#242b3e;--ink:#eeedf5;--muted:#b0b2c6;--line:#373d51;--rose:#e2aac0;--blue:#aabbed;--chip:#303047;--wash:#272d44}}</style></defs><rect x="1" y="1" width="718" height="298" rx="24" class="paper line" stroke-width="2"/><rect x="22" y="32" width="4" height="232" rx="2" fill="#bd7b90"/><text x="42" y="55" class="mono muted" font-size="15" letter-spacing="1.5">01 / DESKTOP MUSIC</text><text x="40" y="112" class="ink" font-size="34" font-weight="620" letter-spacing="-1">TuneFree Desktop</text><text x="42" y="176" class="muted" font-size="26">把歌单、本地曲库与桌面歌词，</text><text x="42" y="214" class="muted" font-size="26">放回同一个音乐空间。</text><text x="42" y="267" class="mono muted" font-size="18">Tauri  ·  React  ·  TypeScript  ·  Rust</text><g transform="translate(-50 -3) scale(.62)" color="#bd7b90"><circle cx="1076" cy="132" r="74" class="wash"/><circle cx="1076" cy="132" r="57" fill="none" stroke="currentColor" opacity=".5"/><circle cx="1076" cy="132" r="43" fill="none" stroke="currentColor" opacity=".35"/><circle cx="1076" cy="132" r="26" fill="currentColor" opacity=".2"/><circle cx="1076" cy="132" r="6" fill="currentColor"/><path d="M963 170v-23m