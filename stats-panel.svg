<svg width="1000" height="330" viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">animated profile stats panel</title><desc id="desc">Animated local SVG stats style cards.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1000" y2="330"><stop stop-color="#080A16"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="g" x1="70" y1="70" x2="930" y2="270"><stop stop-color="#FF3FD4"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.line{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 5s ease-in-out infinite}.bar{animation:bar 2.8s ease-in-out infinite;transform-origin:bottom}.b2{animation-delay:-.4s}.b3{animation-delay:-.8s}.b4{animation-delay:-1.2s}@keyframes draw{0%{stroke-dashoffset:900;opacity:.3}55%,75%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-900;opacity:.25}}@keyframes bar{0%,100%{transform:scaleY(.36);opacity:.55}50%{transform:scaleY(1);opacity:1}}</style></defs>
  <rect width="1000" height="330" rx="30" fill="url(#bg)"/><rect x="2" y="2" width="996" height="326" rx="28" stroke="#FFFFFF" stroke-opacity=".1"/>
  <text x="54" y="62" fill="#F8FAFC" font-family="Segoe UI,Arial" font-size="30" font-weight="900">Profile Dashboard</text><text x="54" y="91" fill="#A5B4FC" font-family="Segoe UI,Arial" font-size="15" font-weight="700" letter-spacing="2">STATIC DATA · ANIMATED LOOK · NO EXTERNAL API</text>
  <g font-family="Segoe UI,Arial" font-weight="800">
    <rect x="58" y="126" width="206" height="134" rx="22" fill="#0D1020" stroke="#FF3FD4" stroke-opacity=".35"/><text x="82" y="166" fill="#FCE7F3" font-size="17">Focus</text><text x="82" y="206" fill="#FFFFFF" font-size="26">Mobile Apps</text><text x="82" y="234" fill="#94A3B8" font-size="14">Flutter first</text>
    <rect x="294" y="126" width="206" height="134" rx="22" fill="#0D1020" stroke="#22D3EE" stroke-opacity=".35"/><text x="318" y="166" fill="#CFFAFE" font-size="17">Mode</text><text x="318" y="206" fill="#FFFFFF" font-size="26">Shipping</text><text x="318" y="234" fill="#94A3B8" font-size="14">build, test, release</text>
    <rect x="530" y="126" width="206" height="134" rx="22" fill="#0D1020" stroke="#8B5CF6" stroke-opacity=".35"/><text x="554" y="166" fill="#EDE9FE" font-size="17">Style</text><text x="554" y="206" fill="#FFFFFF" font-size="26">Anime UI</text><text x="554" y="234" fill="#94A3B8" font-size="14">dark neon details</text>
  </g>
  <g transform="translate(786 112)" filter="url(#glow)"><rect class="bar" x="0" y="118" width="18" height="86" rx="9" fill="#FF3FD4"/><rect class="bar b2" x="34" y="78" width="18" height="126" rx="9" fill="#8B5CF6"/><rect class="bar b3" x="68" y="44" width="18" height="160" rx="9" fill="#22D3EE"/><rect class="bar b4" x="102" y="94" width="18" height="110" rx="9" fill="#FFB86B"/></g>
  <path class="line" d="M60 292C146 268 204 286 280 252C362 216 428 240 498 218C574 194 626 238 704 204C778 172 844 190 930 154" stroke="url(#g)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
</svg>
