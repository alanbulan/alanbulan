<svg width="960" height="146" viewBox="0 0 960 146" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">animated colorful intro</title><desc id="desc">Colorful animated Japanese style typing title.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF3FD4"><animate attributeName="stop-color" values="#FF3FD4;#8B5CF6;#22D3EE;#FFB86B;#FF3FD4" dur="5s" repeatCount="indefinite"/></stop><stop offset=".5" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#FF3FD4;#FFB86B;#8B5CF6;#22D3EE" dur="5s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#8B5CF6"><animate attributeName="stop-color" values="#8B5CF6;#22D3EE;#FF3FD4;#FFB86B;#8B5CF6" dur="5s" repeatCount="indefinite"/></stop></linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.line{font-family:Yu Gothic,Meiryo,Segoe UI,Arial,sans-serif;font-weight:900;fill:url(#g);filter:url(#glow);opacity:0}.l1{animation:s1 9s ease-in-out infinite}.l2{animation:s2 9s ease-in-out infinite}.l3{animation:s3 9s ease-in-out infinite}.cursor{animation:blink .8s step-end infinite}.scan{animation:scan 4.5s linear infinite}@keyframes s1{0%,29%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-9px)}}@keyframes s2{0%,31%{opacity:0;transform:translateY(9px)}36%,63%{opacity:1;transform:translateY(0)}68%,100%{opacity:0;transform:translateY(-9px)}}@keyframes s3{0%,65%{opacity:0;transform:translateY(9px)}70%,96%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-9px)}}@keyframes blink{50%{opacity:0}}@keyframes scan{0%{transform:translateX(-160px);opacity:0}20%,70%{opacity:.45}100%{transform:translateX(980px);opacity:0}}</style>
  </defs>
  <rect width="960" height="146" rx="28" fill="#080A16"/><rect x="2" y="2" width="956" height="142" rx="26" stroke="#FFFFFF" stroke-opacity="0.12"/><rect class="scan" width="140" height="146" fill="url(#g)" opacity="0.12"/>
  <text class="line l1" x="480" y="88" font-size="46" text-anchor="middle">こんにちは, alanbulan</text><text class="line l2" x="480" y="88" font-size="42" text-anchor="middle">Flutter · Music · Mobile Tools</text><text class="line l3" x="480" y="88" font-size="42" text-anchor="middle">東京の夜にコードを書く</text><rect class="cursor" x="790" y="50" width="5" height="48" rx="2.5" fill="#F8FAFC" opacity="0.8"/>
</svg>
