<svg width="1000" height="360" viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">animated tech grid</title><desc id="desc">Animated neon tech stack grid.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1000" y2="360"><stop stop-color="#080A16"/><stop offset="1" stop-color="#10172A"/></linearGradient><linearGradient id="g" x1="80" y1="40" x2="920" y2="300"><stop stop-color="#FF3FD4"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.card{animation:float 5s ease-in-out infinite}.c2{animation-delay:-.6s}.c3{animation-delay:-1.1s}.c4{animation-delay:-1.7s}.c5{animation-delay:-2.3s}.c6{animation-delay:-2.9s}.ring{animation:spin 18s linear infinite;transform-origin:500px 180px}.dot{animation:pulse 2s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}</style></defs>
  <rect width="1000" height="360" rx="30" fill="url(#bg)"/><rect x="2" y="2" width="996" height="356" rx="28" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <g class="ring" opacity=".32" stroke="url(#g)"><circle cx="500" cy="180" r="126"/><circle cx="500" cy="180" r="172" stroke-dasharray="8 16"/></g>
  <text x="54" y="66" fill="#F8FAFC" font-family="Segoe UI,Arial" font-size="30" font-weight="900">Tech Stack</text><text x="54" y="96" fill="#A5B4FC" font-family="Segoe UI,Arial" font-size="15" font-weight="700" letter-spacing="2">LOCAL SVG · NO BROKEN BADGES</text>
  <g font-family="Segoe UI,Arial" font-weight="900" filter="url(#glow)">
    <g class="card"><rect x="80" y="134" width="132" height="72" rx="18" fill="#111827" stroke="#FF3FD4" stroke-opacity=".55"/><text x="146" y="178" fill="#FCE7F3" text-anchor="middle" font-size="20">Flutter</text></g>
    <g class="card c2"><rect x="242" y="134" width="132" height="72" rx="18" fill="#111827" stroke="#22D3EE" stroke-opacity=".55"/><text x="308" y="178" fill="#CFFAFE" text-anchor="middle" font-size="20">Dart</text></g>
    <g class="card c3"><rect x="404" y="134" width="132" height="72" rx="18" fill="#111827" stroke="#8B5CF6" stroke-opacity=".55"/><text x="470" y="178" fill="#EDE9FE" text-anchor="middle" font-size="20">React</text></g>
    <g class="card c4"><rect x="566" y="134" width="132" height="72" rx="18" fill="#111827" stroke="#FFB86B" stroke-opacity=".55"/><text x="632" y="178" fill="#FFE7C2" text-anchor="middle" font-size="20">TypeScript</text></g>
    <g class="card c5"><rect x="728" y="134" width="132" height="72" rx="18" fill="#111827" stroke="#22D3EE" stroke-opacity=".55"/><text x="794" y="178" fill="#CFFAFE" text-anchor="middle" font-size="20">Node.js</text></g>
    <g class="card c6"><rect x="338" y="238" width="132" height="72" rx="18" fill="#111827" stroke="#FF3FD4" stroke-opacity=".55"/><text x="404" y="282" fill="#FCE7F3" text-anchor="middle" font-size="20">Python</text></g>
    <g class="card c3"><rect x="530" y="238" width="132" height="72" rx="18" fill="#111827" stroke="#8B5CF6" stroke-opacity=".55"/><text x="596" y="282" fill="#EDE9FE" text-anchor="middle" font-size="20">GitHub</text></g>
  </g>
  <g class="dot" fill="url(#g)"><circle cx="500" cy="180" r="5"/><circle cx="250" cy="268" r="4"/><circle cx="760" cy="96" r="4"/></g>
</svg>
