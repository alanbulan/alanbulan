<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">animated music panel</title>
  <desc id="desc">Animated neon anime music player panel.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0B18"/>
      <stop offset="0.55" stop-color="#15102A"/>
      <stop offset="1" stop-color="#061827"/>
    </linearGradient>
    <linearGradient id="neon" x1="120" y1="60" x2="880" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4FD8"/>
      <stop offset="0.52" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .bar1 { animation: bar 1.1s ease-in-out infinite; transform-origin: bottom; }
      .bar2 { animation: bar 1.4s ease-in-out infinite .2s; transform-origin: bottom; }
      .bar3 { animation: bar 1s ease-in-out infinite .35s; transform-origin: bottom; }
      .bar4 { animation: bar 1.5s ease-in-out infinite .1s; transform-origin: bottom; }
      .disc { animation: spin 6s linear infinite; transform-origin: 150px 150px; }
      .progress { stroke-dasharray: 560; stroke-dashoffset: 560; animation: progress 5s linear infinite; }
      .shine { animation: shine 4.2s linear infinite; }
      @keyframes bar { 0%,100% { transform: scaleY(.32); opacity:.55; } 50% { transform: scaleY(1); opacity:1; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes progress { 0% { stroke-dashoffset: 560; } 65%,100% { stroke-dashoffset: 80; } }
      @keyframes shine { 0% { transform: translateX(-240px); opacity:0; } 20%,70% { opacity:.38; } 100% { transform: translateX(920px); opacity:0; } }
    </style>
  </defs>
  <rect width="1000" height="300" rx="30" fill="url(#panel)"/>
  <rect x="2" y="2" width="996" height="296" rx="28" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <rect class="shine" x="0" y="0" width="160" height="300" fill="url(#neon)" opacity="0.16"/>

  <g class="disc" filter="url(#glow)">
    <circle cx="150" cy="150" r="82" fill="#0F1224" stroke="url(#neon)" stroke-width="8"/>
    <circle cx="150" cy="150" r="46" fill="#080A16" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="150" cy="150" r="12" fill="#22D3EE"/>
    <path d="M150 68A82 82 0 0 1 232 150" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="280" y="92" fill="#F8FAFC" font-size="34" font-weight="900">Night Drive Playlist</text>
    <text x="280" y="126" fill="#A5B4FC" font-size="18" font-weight="700" letter-spacing="2">J-STYLE · SYNTHWAVE · MOBILE FLOW</text>
    <text x="280" y="184" fill="#CBD5E1" font-size="18" font-weight="600">Designing player screens, search flows, and small tools with a darker anime mood.</text>
  </g>

  <g transform="translate(284 220)" filter="url(#glow)">
    <path d="M0 0H560" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="10" stroke-linecap="round"/>
    <path class="progress" d="M0 0H560" stroke="url(#neon)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g transform="translate(875 82)" filter="url(#glow)">
    <rect class="bar1" x="0" y="90" width="12" height="88" rx="6" fill="#FF4FD8"/>
    <rect class="bar2" x="24" y="54" width="12" height="124" rx="6" fill="#8B5CF6"/>
    <rect class="bar3" x="48" y="28" width="12" height="150" rx="6" fill="#22D3EE"/>
    <rect class="bar4" x="72" y="70" width="12" height="108" rx="6" fill="#FFB86B"/>
  </g>
</svg>
